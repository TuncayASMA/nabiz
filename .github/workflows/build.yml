name: Build and verify
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-15, arch: arm64 }
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm audit --omit=dev
      - run: npm test
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 libfuse2t64
          # Ephemeral CI runner only: let Chromium use its user-namespace sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: UI smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args='-screen 0 1280x1024x24' sh -c 'openbox >/tmp/nabiz-wm.log 2>&1 & npm run test:ui'
      - name: UI smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:ui
      - run: npm run dist
      - name: Verify packaged app contents
        run: node scripts/audit-release.cjs
      - name: Packaged UI smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args='-screen 0 1280x1024x24' sh -c 'openbox >/tmp/nabiz-wm.log 2>&1 & node scripts/smoke.cjs --release'
      - name: Packaged UI smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: node scripts/smoke.cjs --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nabiz-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: diagnostics-${{ runner.os }}-${{ matrix.arch }}
          path: artifacts/widget.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: Nabiz-*
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum Nabiz-* > SHA256SUMS.txt
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Nabız $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
